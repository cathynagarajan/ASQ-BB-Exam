c_entity", "name": "ability", "file_path": "documents/Unit1_Quality_And_Change_Leaders_Table.docx", "description": "Shared domain topic 'ability' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "ability"}}, {"id": "topic:awareness", "type": "topic_entity", "name": "awareness", "file_path": "documents/Unit1_Quality_And_Change_Leaders_Table.docx", "description": "Shared domain topic 'awareness' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "awareness"}}, {"id": "topic:benefits", "type": "topic_entity", "name": "benefits", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'benefits' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "benefits"}}, {"id": "topic:costs", "type": "topic_entity", "name": "costs", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'costs' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "costs"}}, {"id": "topic:yield", "type": "topic_entity", "name": "yield", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'yield' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "yield"}}, {"id": "doc_file:documents/Unit2_Formulas_Master_Sheet.docx", "type": "document_file", "name": "Unit2_Formulas_Master_Sheet.docx", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Document Unit2_Formulas_Master_Sheet.docx (7 section(s)): ASQ CSSBB Unit 2 (Domain II) \u2014 Complete Formula Master Sheet (With Worked Examples) Metric Exact Formula (Plain Text) Worked Step-by-Step Example DPU (Defects Per Unit) DPU = Total", "metadata": {"format": "docx", "section_count": 7, "size_bytes": 2841, "topics": ["total", "defects", "cost", "copq", "dpmo", "benefits", "costs", "yield"]}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:1", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 1]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 1 of Unit2_Formulas_Master_Sheet.docx: ASQ CSSBB Unit 2 (Domain II) \u2014 Complete Formula Master Sheet (With Worked Examples) Metric Exact Formula (Plain Text) Worked Step-by-Step Example DPU (Defects Per Unit) DPU = Total Defects / Total Units 15 defects on 10 ", "metadata": {"section_index": 1, "section_type": "section", "text_excerpt": "ASQ CSSBB Unit 2 (Domain II) \u2014 Complete Formula Master Sheet (With Worked Examples)\nMetric\nExact Formula (Plain Text)\nWorked Step-by-Step Example\nDPU (Defects Per Unit)\nDPU = Total Defects / Total Units\n15 defects on 10 invoices -> 15 / 10 = 1.50 DPU\nDPO (Defects Per Opportunity)", "char_count": 280}}, {"id": "topic:formula", "type": "topic_entity", "name": "formula", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'formula' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "formula"}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:2", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 2]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 2 of Unit2_Formulas_Master_Sheet.docx: DPO = Total Defects / (Units x Opportunities per Unit) 15 defects, 10 invoices, 5 fields each -> 15 / (10 x 5) = 15 / 50 = 0.30 DPO DPMO (Defects Per Million Opp.) DPMO = DPO x 1,000,000 0.00621 DPO x 1,000,000 = 6,210 D", "metadata": {"section_index": 2, "section_type": "section", "text_excerpt": "DPO = Total Defects / (Units x Opportunities per Unit)\n15 defects, 10 invoices, 5 fields each -> 15 / (10 x 5) = 15 / 50 = 0.30 DPO\nDPMO (Defects Per Million Opp.)\nDPMO = DPO x 1,000,000\n0.00621 DPO x 1,000,000 = 6,210 DPMO (4 Sigma)\nFinal Yield (Traditional)\nFinal Yield = (Good Shipped incl. Rework) / Total Started\n100 started, 90 good 1st pass + 8 reworked = 98 / 100 = 98% (hides rework!)", "char_count": 393}}, {"id": "topic:final", "type": "topic_entity", "name": "final", "file_path": "chats/transcript_6e8422d1.jsonl", "description": "Shared domain topic 'final' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "final"}}, {"id": "topic:good", "type": "topic_entity", "name": "good", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'good' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "good"}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:3", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 3]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 3 of Unit2_Formulas_Master_Sheet.docx: FTY (First Time Yield) FTY = (Entered - Scrap - Rework) / Entered 100 entered, 2 scrap, 8 reworked -> (100 - 2 - 8) / 100 = 90 / 100 = 90% RTY (Rolled Throughput Yield) RTY = FTY1 x FTY2 x FTY3 ... (or shortcut: e^(-DPU)", "metadata": {"section_index": 3, "section_type": "section", "text_excerpt": "FTY (First Time Yield)\nFTY = (Entered - Scrap - Rework) / Entered\n100 entered, 2 scrap, 8 reworked -> (100 - 2 - 8) / 100 = 90 / 100 = 90%\nRTY (Rolled Throughput Yield)\nRTY = FTY1 x FTY2 x FTY3 ...  (or shortcut: e^(-DPU))\n3 steps at 90%, 95%, 80% -> 0.90 x 0.95 x 0.80 = 0.684 = 68.4% (e^-0.38 = 68.4%)\nTotal Cost of Quality (COQ)\nCOQ = Prevention + Appraisal + Internal Fail + External Fail", "char_count": 392}}, {"id": "topic:entered", "type": "topic_entity", "name": "entered", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'entered' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "entered"}}, {"id": "topic:fail", "type": "topic_entity", "name": "fail", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'fail' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "fail"}}, {"id": "topic:scrap", "type": "topic_entity", "name": "scrap", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'scrap' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "scrap"}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:4", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 4]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 4 of Unit2_Formulas_Master_Sheet.docx: 10K + 20K + 35K + 55K = 120K Total COQ COPQ (Cost of Poor Quality) COPQ = Internal Failure + External Failure | COPQ % = (COPQ / Revenue) x 100% 35K + 55K = 90K COPQ; on 1,000K revenue -> 90 / 1000 = 9.0% ROI (Return on ", "metadata": {"section_index": 4, "section_type": "section", "text_excerpt": "10K + 20K + 35K + 55K = 120K Total COQ\nCOPQ (Cost of Poor Quality)\nCOPQ = Internal Failure + External Failure  |  COPQ % = (COPQ / Revenue) x 100%\n35K + 55K = 90K COPQ; on 1,000K revenue -> 90 / 1000 = 9.0%\nROI (Return on Investment)\nROI (%) = [(Total Benefits - Total Costs) / Total Costs] x 100%\n150K benefits, 100K cost -> [(150 - 100) / 100] x 100% = 50% ROI\nPayback Period", "char_count": 377}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:5", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 5]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 5 of Unit2_Formulas_Master_Sheet.docx: Payback (yrs) = Initial Upfront Investment / Annual Cash Savings 120K investment / 40K annual savings = 3.0 years (shorter = better) Future Value (FV) FV = PV x (1 + r)^n 10,000 USD at 10% for 2 yrs -> 10,000 x (1.10)^2 ", "metadata": {"section_index": 5, "section_type": "section", "text_excerpt": "Payback (yrs) = Initial Upfront Investment / Annual Cash Savings\n120K investment / 40K annual savings = 3.0 years (shorter = better)\nFuture Value (FV)\nFV = PV x (1 + r)^n\n10,000 USD at 10% for 2 yrs -> 10,000 x (1.10)^2 = 12,100 USD\nPresent Value (PV)\nPV = FV / (1 + r)^n\n12,100 USD received in 2 yrs at 10% -> 12,100 / (1.10)^2 = 10,000 USD", "char_count": 341}}, {"id": "topic:investment", "type": "topic_entity", "name": "investment", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'investment' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "investment"}}, {"id": "topic:value", "type": "topic_entity", "name": "value", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'value' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "value"}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:6", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 6]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 6 of Unit2_Formulas_Master_Sheet.docx: NPV (Net Present Value) NPV = [CF1/(1+r)^1 + CF2/(1+r)^2 + ... + CFn/(1+r)^n] - Initial Cost Cost 100K, r=10%, CF1=60K, CF2=60K -> (60/1.1 + 60/1.21) - 100 = 54.55+49.59-100 = +4.14K (Approve!) IRR (Internal Rate of Retu", "metadata": {"section_index": 6, "section_type": "section", "text_excerpt": "NPV (Net Present Value)\nNPV = [CF1/(1+r)^1 + CF2/(1+r)^2 + ... + CFn/(1+r)^n] - Initial Cost\nCost 100K, r=10%, CF1=60K, CF2=60K -> (60/1.1 + 60/1.21) - 100 = 54.55+49.59-100 = +4.14K (Approve!)\nIRR (Internal Rate of Return)\nSolve for rate r where NPV = 0: Sum[CFt/(1+IRR)^t] - Initial Cost = 0\nIf IRR = 16% and company Hurdle Rate (MARR) = 12% -> Approve (16% > 12%)\nCBA / BCR (Benefit-Cost Ratio)\nBCR = Total Discounted Benefits / Total Discounted Costs", "char_count": 454}}, {"id": "doc_sec:documents/Unit2_Formulas_Master_Sheet.docx:7", "type": "document_section", "name": "Unit2_Formulas_Master_Sheet.docx [Section 7]", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Section 7 of Unit2_Formulas_Master_Sheet.docx: 180K benefits / 120K costs = 1.50 (BCR > 1.0 = Approve!) ROA (Return on Assets) ROA (%) = (Net Income / Total Assets) x 100% 2M net income / 25M total assets = 8.0% ROA Sigma Level <-> DPMO Key 2s=308,538 | 3s=66,807 | 4", "metadata": {"section_index": 7, "section_type": "section", "text_excerpt": "180K benefits / 120K costs = 1.50 (BCR > 1.0 = Approve!)\nROA (Return on Assets)\nROA (%) = (Net Income / Total Assets) x 100%\n2M net income / 25M total assets = 8.0% ROA\nSigma Level <-> DPMO Key\n2s=308,538 | 3s=66,807 | 4s=6,210 | 5s=233 | 6s=3.4 DPMO\nAll include ASQ's standard 1.5-sigma long-term shift", "char_count": 303}}, {"id": "topic:assets", "type": "topic_entity", "name": "assets", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'assets' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "assets"}}, {"id": "topic:income", "type": "topic_entity", "name": "income", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'income' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "income"}}, {"id": "topic:benchmarking", "type": "topic_entity", "name": "benchmarking", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'benchmarking' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "benchmarking"}}, {"id": "topic:company", "type": "topic_entity", "name": "company", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'company' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "company"}}, {"id": "doc_file:documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "type": "document_file", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Document Unit2_Process_Mgmt_And_Measures_Table.docx (10 section(s)): ASQ CSSBB Unit 2 (Domain II) \u2014 Metrics, Yield, Financials & Benchmarking Bible Table Term / Metric Plain-English Formula or Trigger Simple Real-Life Example Defect vs. Defective De", "metadata": {"format": "docx", "section_count": 10, "size_bytes": 3306, "topics": ["defects", "total", "benchmarking", "company", "cost", "customer", "internal", "unit"]}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:1", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 1]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 1 of Unit2_Process_Mgmt_And_Measures_Table.docx: ASQ CSSBB Unit 2 (Domain II) \u2014 Metrics, Yield, Financials & Benchmarking Bible Table Term / Metric Plain-English Formula or Trigger Simple Real-Life Example Defect vs. Defective Defect = 1 flaw; Defective = 1 bad unit 1 ", "metadata": {"section_index": 1, "section_type": "section", "text_excerpt": "ASQ CSSBB Unit 2 (Domain II) \u2014 Metrics, Yield, Financials & Benchmarking Bible Table\nTerm / Metric\nPlain-English Formula or Trigger\nSimple Real-Life Example\nDefect vs. Defective\nDefect = 1 flaw; Defective = 1 bad unit\n1 invoice with 3 typos = 1 defective invoice, 3 defects!\nDPU (Defects Per Unit)", "char_count": 297}}, {"id": "topic:defective", "type": "topic_entity", "name": "defective", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'defective' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "defective"}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:2", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 2]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 2 of Unit2_Process_Mgmt_And_Measures_Table.docx: Total Defects / Total Units 15 typos across 10 invoices -> 15 / 10 = 1.50 DPU DPO (Defects Per Opportunity) Defects / (Units x Opportunities per unit) 15 typos / (10 invoices x 5 fields) = 15 / 50 = 0.30 DPO DPMO (Defect", "metadata": {"section_index": 2, "section_type": "section", "text_excerpt": "Total Defects / Total Units\n15 typos across 10 invoices -> 15 / 10 = 1.50 DPU\nDPO (Defects Per Opportunity)\nDefects / (Units x Opportunities per unit)\n15 typos / (10 invoices x 5 fields) = 15 / 50 = 0.30 DPO\nDPMO (Defects Per Million Opp.)\nDPO x 1,000,000\n0.0000034 DPO x 1,000,000 = 3.4 DPMO (Six Sigma!)", "char_count": 305}}, {"id": "topic:invoices", "type": "topic_entity", "name": "invoices", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'invoices' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "invoices"}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:3", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 3]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 3 of Unit2_Process_Mgmt_And_Measures_Table.docx: FTY (First Time Yield) Good units FIRST pass / Total units entered 90 good on 1st try out of 100 (even if 8 get reworked!) -> FTY = 90% RTY (Rolled Throughput Yield) Multiply every step's FTY: Y1 x Y2 x Y3 3 steps at 90%", "metadata": {"section_index": 3, "section_type": "section", "text_excerpt": "FTY (First Time Yield)\nGood units FIRST pass / Total units entered\n90 good on 1st try out of 100 (even if 8 get reworked!) -> FTY = 90%\nRTY (Rolled Throughput Yield)\nMultiply every step's FTY: Y1 x Y2 x Y3\n3 steps at 90% each -> 0.90 x 0.90 x 0.90 = 72.9% (also e^-DPU)\nCOQ - Prevention\nStop mistakes BEFORE making/shipping", "char_count": 323}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:4", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 4]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 4 of Unit2_Process_Mgmt_And_Measures_Table.docx: Operator training, preventive maintenance, design reviews, Poka-yoke COQ - Appraisal CHECK / TEST / INSPECT / CALIBRATE Incoming wheat inspection, lab tests, audits, GAGE CALIBRATION! COQ - Internal Failure Caught & fixe", "metadata": {"section_index": 4, "section_type": "section", "text_excerpt": "Operator training, preventive maintenance, design reviews, Poka-yoke\nCOQ - Appraisal\nCHECK / TEST / INSPECT / CALIBRATE\nIncoming wheat inspection, lab tests, audits, GAGE CALIBRATION!\nCOQ - Internal Failure\nCaught & fixed BEFORE customer sees it\nScrap, rework, re-palletizing torn bags on your own dock\nCOQ - External Failure", "char_count": 325}}, {"id": "topic:appraisal", "type": "topic_entity", "name": "appraisal", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'appraisal' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "appraisal"}}, {"id": "topic:bags", "type": "topic_entity", "name": "bags", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'bags' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "bags"}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:5", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 5]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 5 of Unit2_Process_Mgmt_And_Measures_Table.docx: Customer finds it AFTER delivery (worst!) Customer returns, warranty claims, recalls, lost customers ROI (Return on Investment) (Net Savings - Cost) / Cost x 100% 150K benefit on 100K cost -> (150-100)/100 = 50% ROI Payb", "metadata": {"section_index": 5, "section_type": "section", "text_excerpt": "Customer finds it AFTER delivery (worst!)\nCustomer returns, warranty claims, recalls, lost customers\nROI (Return on Investment)\n(Net Savings - Cost) / Cost x 100%\n150K benefit on 100K cost -> (150-100)/100 = 50% ROI\nPayback Period\nUpfront Investment / Annual Cash Savings\n120K software / 40K savings per yr = 3.0 years (shorter = better)", "char_count": 337}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:6", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 6]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 6 of Unit2_Process_Mgmt_And_Measures_Table.docx: NPV (Net Present Value) Today's value of future cash minus cost NPV > 0 = Approve (creates wealth); NPV < 0 = Reject! IRR (Internal Rate of Return) Discount rate where NPV equals 0 Approve if IRR is HIGHER than company h", "metadata": {"section_index": 6, "section_type": "section", "text_excerpt": "NPV (Net Present Value)\nToday's value of future cash minus cost\nNPV > 0 = Approve (creates wealth); NPV < 0 = Reject!\nIRR (Internal Rate of Return)\nDiscount rate where NPV equals 0\nApprove if IRR is HIGHER than company hurdle rate\nCBA (Cost-Benefit Analysis)\nTotal Benefits / Total Costs", "char_count": 287}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:7", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 7]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 7 of Unit2_Process_Mgmt_And_Measures_Table.docx: Ratio > 1.0 means benefits beat costs ROA (Return on Assets) Net Income / Total Assets How efficiently the company turns equipment/assets into profit Balanced Scorecard (4 Views) Financial, Customer, Internal Process, Le", "metadata": {"section_index": 7, "section_type": "section", "text_excerpt": "Ratio > 1.0 means benefits beat costs\nROA (Return on Assets)\nNet Income / Total Assets\nHow efficiently the company turns equipment/assets into profit\nBalanced Scorecard (4 Views)\nFinancial, Customer, Internal Process, Learning & Growth\nPrevents chasing short-term profit while burning out people/quality\nKPI vs. KBI vs. OKR", "char_count": 323}}, {"id": "topic:profit", "type": "topic_entity", "name": "profit", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'profit' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "profit"}}, {"id": "topic:balanced", "type": "topic_entity", "name": "balanced", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'balanced' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "balanced"}}, {"id": "topic:beat", "type": "topic_entity", "name": "beat", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'beat' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "beat"}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:8", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 8]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 8 of Unit2_Process_Mgmt_And_Measures_Table.docx: KPI = outcome; KBI = habit; OKR = Goal + Milestones KPI: 98% OTD; KBI: daily Gemba walk; OKR: #1 speed -> cut cycle 10d to 2d Leading vs. Lagging Leading = predicts future; Lagging = past result Leading: brake checks don", "metadata": {"section_index": 8, "section_type": "section", "text_excerpt": "KPI = outcome; KBI = habit; OKR = Goal + Milestones\nKPI: 98% OTD; KBI: daily Gemba walk; OKR: #1 speed -> cut cycle 10d to 2d\nLeading vs. Lagging\nLeading = predicts future; Lagging = past result\nLeading: brake checks done today; Lagging: quarterly highway arn a similar process from ANOTHER industry\nHospital ER studies a NASCAR pit crew for fast handoffs\nBenchmarking - Strategic / Breakthrough\nLong-term business model / big leap", "char_count": 336}}, {"id": "topic:bank", "type": "topic_entity", "name": "bank", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'bank' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "bank"}}, {"id": "topic:industry", "type": "topic_entity", "name": "industry", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'industry' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "industry"}}, {"id": "doc_sec:documents/Unit2_Process_Mgmt_And_Measures_Table.docx:10", "type": "document_section", "name": "Unit2_Process_Mgmt_And_Measures_Table.docx [Section 10]", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Section 10 of Unit2_Process_Mgmt_And_Measures_Table.docx: Studying top global leaders to reinvent how your whole company competes", "metadata": {"section_index": 10, "section_type": "section", "text_excerpt": "Studying top global leaders to reinvent how your whole company competes", "char_count": 71}}, {"id": "topic:competes", "type": "topic_entity", "name": "competes", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'competes' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "competes"}}, {"id": "topic:leaders", "type": "topic_entity", "name": "leaders", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'leaders' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "leaders"}}, {"id": "topic:everyone", "type": "topic_entity", "name": "everyone", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'everyone' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "everyone"}}, {"id": "topic:addie", "type": "topic_entity", "name": "addie", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'addie' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "addie"}}, {"id": "topic:class", "type": "topic_entity", "name": "class", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'class' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "class"}}, {"id": "topic:silent", "type": "topic_entity", "name": "silent", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'silent' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "silent"}}, {"id": "topic:training", "type": "topic_entity", "name": "training", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'training' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "training"}}, {"id": "topic:kirkpatrick", "type": "topic_entity", "name": "kirkpatrick", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'kirkpatrick' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "kirkpatrick"}}, {"id": "doc_file:documents/Unit3_Team_Management_Bible_Table.docx", "type": "document_file", "name": "Unit3_Team_Management_Bible_Table.docx", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Document Unit3_Team_Management_Bible_Table.docx (15 section(s)): ASQ CSSBB Unit 3 (Domain III: Team Management \u2014 15 Exam Qs) COMPLETE Zero-Gap Bible Part A: Tuckman, Lencioni, Herzberg, McGregor, NGT, Multivoting & Consensus (III.B) Model / Topi", "metadata": {"format": "docx", "section_count": 15, "size_bytes": 6942, "topics": ["everyone", "addie", "class", "high", "silent", "training", "exam", "kirkpatrick"]}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:1", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 1]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 1 of Unit3_Team_Management_Bible_Table.docx: ASQ CSSBB Unit 3 (Domain III: Team Management \u2014 15 Exam Qs) COMPLETE Zero-Gap Bible Part A: Tuckman, Lencioni, Herzberg, McGregor, NGT, Multivoting & Consensus (III.B) Model / Topic MAGIC TRIGGER WORDS Plain-English Brea", "metadata": {"section_index": 1, "section_type": "section", "text_excerpt": "ASQ CSSBB Unit 3 (Domain III: Team Management \u2014 15 Exam Qs) COMPLETE Zero-Gap Bible\nPart A: Tuckman, Lencioni, Herzberg, McGregor, NGT, Multivoting & Consensus (III.B)\nModel / Topic\nMAGIC TRIGGER WORDS\nPlain-English Breakdown\nTuckman 5 Stages\n\"polite\" -> \"arguing\" -> \"rules\" -> \"peak\"\n1) Forming (polite/unclear) -> 2) Storming (clashes/power struggle) -> 3) Norming (ground rules/trust) -> 4) Performing (high gear) -> 5) Adjourning (close). NOTE: Turnover regresses team back to Forming/Storming!", "char_count": 499}}, {"id": "topic:forming", "type": "topic_entity", "name": "forming", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'forming' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "forming"}}, {"id": "topic:polite", "type": "topic_entity", "name": "polite", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'polite' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "polite"}}, {"id": "topic:rules", "type": "topic_entity", "name": "rules", "file_path": "chats/transcript_6e8422d1.jsonl", "description": "Shared domain topic 'rules' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "rules"}}, {"id": "topic:storming", "type": "topic_entity", "name": "storming", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'storming' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "storming"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:2", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 2]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 2 of Unit3_Team_Management_Bible_Table.docx: Lencioni 5 Dysfunctions \"BASE = Absence of Trust\" Pyramid bottom-to-top: 1) Absence of Trust (BASE!) -> 2) Fear of Conflict -> 3) Lack of Commitment -> 4) Avoidance of Accountability -> 5) Inattention to Results. Herzber", "metadata": {"section_index": 2, "section_type": "section", "text_excerpt": "Lencioni 5 Dysfunctions\n\"BASE = Absence of Trust\"\nPyramid bottom-to-top: 1) Absence of Trust (BASE!) -> 2) Fear of Conflict -> 3) Lack of Commitment -> 4) Avoidance of Accountability -> 5) Inattention to Results.\nHerzberg Two-Factor\n\"Hygiene = prevents anger\" | \"Motivator = drive\"\nHygiene (pay, clean office, safe rules) stops complaints when present, like brushing teeth. Motivators (growth, achievement, recognition) inspire real effort.\nMcGregor Theory X vs Y\n\"X = micromanage\" | \"Y = self-motivated\"", "char_count": 504}}, {"id": "topic:absence", "type": "topic_entity", "name": "absence", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'absence' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "absence"}}, {"id": "topic:base", "type": "topic_entity", "name": "base", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'base' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "base"}}, {"id": "topic:hygiene", "type": "topic_entity", "name": "hygiene", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'hygiene' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "hygiene"}}, {"id": "topic:trust", "type": "topic_entity", "name": "trust", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'trust' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "trust"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:3", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 3]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 3 of Unit3_Team_Management_Bible_Table.docx: Theory X assumes workers hate work and need strict control. Theory Y assumes workers want pride and ownership when empowered. NGT (Nominal Group) \"silent writing\" | \"quiet voices heard\" Everyone writes ideas SILENTLY fir", "metadata": {"section_index": 3, "section_type": "section", "text_excerpt": "Theory X assumes workers hate work and need strict control. Theory Y assumes workers want pride and ownership when empowered.\nNGT (Nominal Group)\n\"silent writing\" | \"quiet voices heard\"\nEveryone writes ideas SILENTLY first, shares round-robin, then votes \u2014 stops loud dominant people from hijacking brainstorming!\nMultivoting & Consensus\n\"narrow long list\" | \"everyone can live with it\"\nMultivoting trims a huge list (e.g. 40 -> top 4) fast. Consensus means everyone was heard and can live with the decision (NOT 100% unanimous love!).\nPart B: Thomas-Kilmann 5 Conflict Modes \u2014 EXACT Exam Cheat Sheet (III.C)", "char_count": 608}}, {"id": "topic:assumes", "type": "topic_entity", "name": "assumes", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'assumes' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "assumes"}}, {"id": "topic:consensus", "type": "topic_entity", "name": "consensus", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'consensus' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "consensus"}}, {"id": "topic:heard", "type": "topic_entity", "name": "heard", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'heard' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "heard"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:4", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 4]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 4 of Unit3_Team_Management_Bible_Table.docx: Conflict Mode Outcome / Style MAGIC EXAM TRIGGER WORDS When to Pick It on the Exam Collaborating Win-Win (High Assert / High Coop) \"solve root issue together\" | \"best long-term\" Both sides invent a creative solution meet", "metadata": {"section_index": 4, "section_type": "section", "text_excerpt": "Conflict Mode\nOutcome / Style\nMAGIC EXAM TRIGGER WORDS\nWhen to Pick It on the Exam\nCollaborating\nWin-Win (High Assert / High Coop)\n\"solve root issue together\" | \"best long-term\"\nBoth sides invent a creative solution meeting everyone's core needs. #1 BEST mode when time allows!", "char_count": 277}}, {"id": "topic:best", "type": "topic_entity", "name": "best", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'best' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "best"}}, {"id": "topic:mode", "type": "topic_entity", "name": "mode", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'mode' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "mode"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:5", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 5]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 5 of Unit3_Team_Management_Bible_Table.docx: Compromising 50/50 Split (Mid / Mid) \"meet halfway\" | \"both give up something\" Tight deadline \u2014 both sides give up a little to make a quick middle-ground deal (e.g. 2.5 days each). Competing (Forcing) Win-Lose (High Asse", "metadata": {"section_index": 5, "section_type": "section", "text_excerpt": "Compromising\n50/50 Split (Mid / Mid)\n\"meet halfway\" | \"both give up something\"\nTight deadline \u2014 both sides give up a little to make a quick middle-ground deal (e.g. 2.5 days each).\nCompeting (Forcing)\nWin-Lose (High Assert / Low Coop)\n\"EMERGENCY / SAFETY\" | \"crisis / leaking valve\"\nImmediate safety hazard or urgent crisis where a leader must command fast with zero debate!", "char_count": 374}}, {"id": "topic:crisis", "type": "topic_entity", "name": "crisis", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'crisis' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "crisis"}}, {"id": "topic:give", "type": "topic_entity", "name": "give", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'give' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "give"}}, {"id": "topic:safety", "type": "topic_entity", "name": "safety", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'safety' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "safety"}}, {"id": "topic:assert", "type": "topic_entity", "name": "assert", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'assert' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "assert"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:6", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 6]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 6 of Unit3_Team_Management_Bible_Table.docx: Accommodating Lose-Win (Low Assert / High Coop) \"give in to keep peace\" | \"matters WAY more to them\" Tiny issue barely matters to you (e.g. chart color / slide title) but matters hugely to them -> yield gracefully! Avoid", "metadata": {"section_index": 6, "section_type": "section", "text_excerpt": "Accommodating\nLose-Win (Low Assert / High Coop)\n\"give in to keep peace\" | \"matters WAY more to them\"\nTiny issue barely matters to you (e.g. chart color / slide title) but matters hugely to them -> yield gracefully!\nAvoiding\nLose-Lose (Low Assert / Low Coop)\n\"trivial issue\" | \"tempers boiling / cool off\"\nIssue is tiny OR people are yelling angrily and need a cooling-off pause first.", "char_count": 384}}, {"id": "topic:matters", "type": "topic_entity", "name": "matters", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'matters' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "matters"}}, {"id": "topic:coop", "type": "topic_entity", "name": "coop", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'coop' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "coop"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:7", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 7]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 7 of Unit3_Team_Management_Bible_Table.docx: Part C: Detailed Group Traps & Disruptive Behaviors + Fixes (III.C) Group Trap / Behavior MAGIC TRIGGER WORDS What It Looks Like in Real Life Best Black Belt / Facilitator Fix Groupthink \"don't rock the boat\" | \"blind ye", "metadata": {"section_index": 7, "section_type": "section", "text_excerpt": "Part C: Detailed Group Traps & Disruptive Behaviors + Fixes (III.C)\nGroup Trap / Behavior\nMAGIC TRIGGER WORDS\nWhat It Looks Like in Real Life\nBest Black Belt / Facilitator Fix\nGroupthink\n\"don't rock the boat\" | \"blind yes\"\nTeam avoids healthy debate to protect harmony and rubber-stamps a risky plan.", "char_count": 300}}, {"id": "topic:avoids", "type": "topic_entity", "name": "avoids", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'avoids' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "avoids"}}, {"id": "topic:behavior", "type": "topic_entity", "name": "behavior", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'behavior' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "behavior"}}, {"id": "topic:behaviors", "type": "topic_entity", "name": "behaviors", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'behaviors' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "behaviors"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:8", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 8]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 8 of Unit3_Team_Management_Bible_Table.docx: Appoint a Devil's Advocate, invite honest dissent, or use NGT (silent writing first). Abilene Paradox \"NOBODY actually wanted it\" Everyone agrees to a bad trip/plan nobody wanted because each thought everyone else wanted", "metadata": {"section_index": 8, "section_type": "section", "text_excerpt": "Appoint a Devil's Advocate, invite honest dissent, or use NGT (silent writing first).\nAbilene Paradox\n\"NOBODY actually wanted it\"\nEveryone agrees to a bad trip/plan nobody wanted because each thought everyone else wanted it!\nSurface honest private views using silent writing (NGT) or anonymous polling before deciding.\nHalo / Horn Effect\n\"1 trait blinds everything else\"\nOne impressive trait (great speaker / Ivy degree) causes biased high ratings on unrelated skills.", "char_count": 468}}, {"id": "topic:wanted", "type": "topic_entity", "name": "wanted", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'wanted' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "wanted"}}, {"id": "topic:else", "type": "topic_entity", "name": "else", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'else' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "else"}}, {"id": "topic:honest", "type": "topic_entity", "name": "honest", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'honest' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "honest"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:9", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 9]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 9 of Unit3_Team_Management_Bible_Table.docx: Use objective, structured scoring rubrics and blind data review instead of gut impressions. Dominating Member \"hijacks talk\" | \"talks over everyone\" One loud manager monopolizes every meeting while experts stay silent. U", "metadata": {"section_index": 9, "section_type": "section", "text_excerpt": "Use objective, structured scoring rubrics and blind data review instead of gut impressions.\nDominating Member\n\"hijacks talk\" | \"talks over everyone\"\nOne loud manager monopolizes every meeting while experts stay silent.\nUse NGT, round-robin speaking order, timekeeper limits, or speak privately 1-on-1 outside the room.\nWithdrawn / Reluctant\n\"stays silent\" | \"never speaks up\"\nA quiet SME holds back valuable knowledge during meetings.", "char_count": 434}}, {"id": "topic:back", "type": "topic_entity", "name": "back", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'back' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "back"}}, {"id": "topic:blind", "type": "topic_entity", "name": "blind", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'blind' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "blind"}}, {"id": "topic:dominating", "type": "topic_entity", "name": "dominating", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'dominating' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "dominating"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:10", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 10]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 10 of Unit3_Team_Management_Bible_Table.docx: Use NGT (silent writing), ask direct open questions in their specialty, or check in 1-on-1 privately. Side Conversations \"whispering\" | \"chatting on the side\" Two team members talk privately while someone else is present", "metadata": {"section_index": 10, "section_type": "section", "text_excerpt": "Use NGT (silent writing), ask direct open questions in their specialty, or check in 1-on-1 privately.\nSide Conversations\n\"whispering\" | \"chatting on the side\"\nTwo team members talk privately while someone else is presenting.\nPause politely, make eye contact, ask \"Would you like to share that with the group?\", enforce ground rules.\nDigressing / Tangents\n\"off-topic\" | \"wandering away\"\nMeeting drifts into unrelated complaints or future wish-list items.", "char_count": 453}}, {"id": "topic:privately", "type": "topic_entity", "name": "privately", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'privately' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "privately"}}, {"id": "topic:side", "type": "topic_entity", "name": "side", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'side' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "side"}}, {"id": "topic:away", "type": "topic_entity", "name": "away", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'away' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "away"}}, {"id": "topic:chatting", "type": "topic_entity", "name": "chatting", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'chatting' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "chatting"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:11", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 11]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 11 of Unit3_Team_Management_Bible_Table.docx: Write the off-topic item on a visible PARKING LOT list and steer right back to the agenda! Feuding / Attacks \"personal attacks\" | \"blaming each other\" Two members argue angrily against each other instead of fixing the wo", "metadata": {"section_index": 11, "section_type": "section", "text_excerpt": "Write the off-topic item on a visible PARKING LOT list and steer right back to the agenda!\nFeuding / Attacks\n\"personal attacks\" | \"blaming each other\"\nTwo members argue angrily against each other instead of fixing the workflow.\nEnforce ground rules (\"attack the process, not the person\"), call a short break, mediate privately.\nPart D: Complete Team Training Guide \u2014 ADDIE, Kirkpatrick 4 Levels & Coaching (III.D)\nTraining Tool / Level\nMAGIC TRIGGER WORDS", "char_count": 455}}, {"id": "topic:attacks", "type": "topic_entity", "name": "attacks", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'attacks' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "attacks"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:12", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 12]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 12 of Unit3_Team_Management_Bible_Table.docx: What It Measures / Does Real-Life ASQ Exam Example ADDIE \u2014 1. Analyze \"Needs Assessment FIRST!\" Identify the TRUE skill gap and audience BEFORE writing a single slide (check if a Poka-yoke is needed instead!). Checking w", "metadata": {"section_index": 12, "section_type": "section", "text_excerpt": "What It Measures / Does\nReal-Life ASQ Exam Example\nADDIE \u2014 1. Analyze\n\"Needs Assessment FIRST!\"\nIdentify the TRUE skill gap and audience BEFORE writing a single slide (check if a Poka-yoke is needed instead!).\nChecking whether billing errors come from missing training vs. a broken screen BEFORE scheduling a class.\nADDIE \u2014 2. Design\n\"learning objectives\" | \"blueprint\"", "char_count": 369}}, {"id": "topic:assessment", "type": "topic_entity", "name": "assessment", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'assessment' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "assessment"}}, {"id": "topic:audience", "type": "topic_entity", "name": "audience", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'audience' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "audience"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:13", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 13]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 13 of Unit3_Team_Management_Bible_Table.docx: Write clear learning goals, lesson sequence, and how you will test mastery. Outlining a 2-hour SPC control-chart curriculum and defining passing criteria. ADDIE \u2014 3. Develop \"build slides / job aids / exercises\" Create t", "metadata": {"section_index": 13, "section_type": "section", "text_excerpt": "Write clear learning goals, lesson sequence, and how you will test mastery.\nOutlining a 2-hour SPC control-chart curriculum and defining passing criteria.\nADDIE \u2014 3. Develop\n\"build slides / job aids / exercises\"\nCreate the actual training slides, quick-reference guides, and practice datasets.\nBuilding a printed 1-page Excel guide and hands-on practice workbook.\nADDIE \u2014 4. Implement\n\"deliver / pilot the class\"", "char_count": 412}}, {"id": "topic:practice", "type": "topic_entity", "name": "practice", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'practice' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "practice"}}, {"id": "topic:aids", "type": "topic_entity", "name": "aids", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'aids' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "aids"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:14", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 14]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 14 of Unit3_Team_Management_Bible_Table.docx: Run the actual training workshop (in-person, virtual, hands-on, or e-learning). Teaching a pilot workshop to 12 warehouse supervisors before full rollout. ADDIE \u2014 5. Evaluate \"measure effectiveness (Kirkpatrick)\" Check w", "metadata": {"section_index": 14, "section_type": "section", "text_excerpt": "Run the actual training workshop (in-person, virtual, hands-on, or e-learning).\nTeaching a pilot workshop to 12 warehouse supervisors before full rollout.\nADDIE \u2014 5. Evaluate\n\"measure effectiveness (Kirkpatrick)\"\nCheck whether the training actually worked and improved performance.\nRunning post-class quizzes and 60-day floor audits to confirm impact.\nKirkpatrick Level 1: Reaction\n\"smile sheet\" | \"liked the class\"", "char_count": 415}}, {"id": "topic:workshop", "type": "topic_entity", "name": "workshop", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'workshop' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "workshop"}}, {"id": "doc_sec:documents/Unit3_Team_Management_Bible_Table.docx:15", "type": "document_section", "name": "Unit3_Team_Management_Bible_Table.docx [Section 15]", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Section 15 of Unit3_Team_Management_Bible_Table.docx: Measures how trainees FELT about the instructor, room, and materials right after class. End-of-day 5-star survey: \"Was the trainer engaging and easy to follow?\" Kirkpatrick Level 2: Learning \"quiz / test\" | \"gained knowl", "metadata": {"section_index": 15, "section_type": "section", "text_excerpt": "Measures how trainees FELT about the instructor, room, and materials right after class.\nEnd-of-day 5-star survey: \"Was the trainer engaging and easy to follow?\"\nKirkpatrick Level 2: Learning\n\"quiz / test\" | \"gained     }

    function writeTextToClipboardFallback(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    }

    async function copyQuery2ToClipboard() {
      const q = (document.getElementById('kg-search-input')?.value || '').trim();
      const ask = (document.getElementById('kg-ask-input')?.value || '').trim();
      const hitNum = Number(getActiveHitSelector());
      const targetNode = top10Results[hitNum - 1] || top10Results[0] || KG_DATA.nodes[0];
      const investigateOnly = activeCliFlags.has('/I');
      const flagsParam = Array.from(activeCliFlags).join(',');

      // 1. Immediate synchronous copy using client-side builder so user-gesture clipboard always succeeds
      let promptText = targetNode
        ? buildClientSideQuery2Prompt(hitNum, targetNode, q, ask, investigateOnly)
        : '';
      if (promptText) {
        writeTextToClipboardFallback(promptText);
      }

      // 2. If hosted via FastAPI portal, also call /api/knowledge-graph/query2 to get full AST snippet & server-side execution
      let cliCmd = document.getElementById('kg-cmd-preview')?.textContent || `query_kg.py "${q}" --#${hitNum}`;
      if (window.location.protocol.startsWith('http')) {
        try {
          const url = `/api/knowledge-graph/query2?q=${encodeURIComponent(q || (targetNode ? targetNode.name : ''))}&hit=${encodeURIComponent(String(hitNum))}&flags=${encodeURIComponent(flagsParam)}&ask=${encodeURIComponent(ask)}`;
          const resp = await fetch(url);
          if (resp.ok) {
            const data = await resp.json();
            if (data.prompt) {
              promptText = data.prompt;
              cliCmd = data.command || cliCmd;
              writeTextToClipboardFallback(promptText);
            }
          }
        } catch (e) {}
      }

      // 3. Visual confirmation on button + preview drawer
      const btn = document.getElementById('kg-copy-q2-btn');
      const lbl = document.getElementById('kg-copy-q2-label');
      if (btn && lbl) {
        btn.classList.add('copied');
        lbl.textContent = `✅ Copied --#${hitNum}!`;
        setTimeout(() => {
          btn.classList.remove('copied');
          updateCliCommandPreview();
        }, 2200);
      }
      const drawer = document.getElementById('kg-prompt-drawer');
      const drawerTitle = document.getElementById('kg-prompt-drawer-title');
      const drawerBody = document.getElementById('kg-prompt-drawer-body');
      if (drawer && drawerTitle && drawerBody) {
        drawerTitle.textContent = `✅ Copied to Clipboard: ${cliCmd}`;
        drawerBody.textContent = promptText;
        drawer.style.display = 'flex';
      }
    }

    // Parse query expression identically to query_kg.py `parse_query_expression` (supporting `/S` or `/s` flag)
    function parseQueryExpr(qStr) {
      const cleaned = (qStr || '').replace(/(?:^|\s)\/[sSiI](?=\s|$)/g, ' ').trim();
      if (!cleaned) return [];
      const tokens = [];
      let buf = '';
      let i = 0;
      while (i < cleaned.length) {
        const ch = cleaned[i];
        if (ch === '"' || ch === "'") {
          const q = ch; i++;
          let phrase = '';
          while (i < cleaned.length && cleaned[i] !== q) phrase += cleaned[i++];
          if (i < cleaned.length && cleaned[i] === q) i++;
          if (buf.trim()) { tokens.push({t:'TERM', v:buf.trim().toLowerCase()}); buf=''; }
          if (phrase.trim()) tokens.push({t:'TERM', v:phrase.trim().toLowerCase()});
        } else if (ch === '+') {
          if (buf.trim()) { tokens.push({t:'TERM', v:buf.trim().toLowerCase()}); buf=''; }
          tokens.push({t:'AND'}); i++;
        } else if (ch === ',') {
          if (buf.trim()) { tokens.push({t:'TERM', v:buf.trim().toLowerCase()}); buf=''; }
          tokens.push({t:'OR'}); i++;
        } else {
          buf += ch; i++;
        }
      }
      if (buf.trim()) {
        buf.trim().split(/\s+/).forEach(w => {
          if (w) tokens.push({t:'TERM', v:w.toLowerCase()});
        });
      }
      const orGroups = [];
      let curAnd = [];
      tokens.forEach(tok => {
        if (tok.t === 'TERM') curAnd.push(tok.v);
        else if (tok.t === 'OR') {
          if (curAnd.length) { orGroups.push(curAnd); curAnd = []; }
        }
      });
      if (curAnd.length) orGroups.push(curAnd);
      return orGroups;
    }

    // Document priority rank identical to `search_kg()` SQL CASE in query_kg.py
    function docPriorityRank(n) {
      if (n.type !== 'document') return 8;
      const fp = n.file_path || '';
      if (fp === 'sap_install/README.md' || fp === 'agent/tower/sap/sap_install/README.md') return 0;
      if (fp === 'README.md' || fp === 'agent/tower/sap/README.md') return 1;
      if (fp === 'man/SAP_S4HANA_TOWER_GUIDE.md') return 2;
      if (fp === 'man/SAP_LICENSE_RENEWAL_GUIDE.md') return 3;
      if (fp === 'agent/tower/sap/sap_install/Makefile' || fp === 'sap_install/Makefile' || fp === 'Makefile') return 4;
      if (fp.startsWith('man/man8/sap-')) return 5;
      if (fp.startsWith('agent/tower/sap/') || fp.startsWith('sap_install/')) return 6;
      return 7;
    }

    // Exact match & ordering function matching `query_kg.py "search text" /S` (#1, #2, #3...)
    function matchAndRankNodes(orGroups) {
      const allTerms = [];
      orGroups.forEach(g => g.forEach(t => allTerms.push(t)));

      const matched = KG_DATA.nodes.filter(n => {
        if (!enabledTypes.has(n.type)) return false;
        if (!orGroups.length) return true;
        const metaJson = JSON.stringify(n.metadata || {}).toLowerCase();
        const hay = `${(n.id || '').toLowerCase()} ${(n.type || '').toLowerCase()} ${(n.name || '').toLowerCase()} ${(n.file_path || '').toLowerCase()} ${(n.description || '').toLowerCase()} ${metaJson}`;
        return orGroups.some(andGroup => andGroup.every(term => hay.includes(term)));
      });

      if (!allTerms.length) {
        // When search box is empty, rank by connectivity degree so the top 10 hubs appear on the top bar
        return matched.slice().sort((a, b) => (DEGREE_MAP.get(b.id) || 0) - (DEGREE_MAP.get(a.id) || 0));
      }

      function tierRank(n) {
        const nameL = (n.name || '').toLowerCase();
        const idL = (n.id || '').toLowerCase();
        if (allTerms.some(t => nameL === t)) return 0;
        if (allTerms.some(t => idL === t)) return 1;
        if (allTerms.some(t => nameL.includes(t))) return 2;
        return 3;
      }

      return matched.slice().sort((a, b) => {
        const tA = tierRank(a), tB = tierRank(b);
        if (tA !== tB) return tA - tB;
        const dA = docPriorityRank(a), dB = docPriorityRank(b);
        if (dA !== dB) return dA - dB;
        const tyCmp = String(a.type || '').localeCompare(String(b.type || ''));
        if (tyCmp !== 0) return tyCmp;
        const nmCmp = String(a.name || '').localeCompare(String(b.name || ''));
        if (nmCmp !== 0) return nmCmp;
        return String(a.file_path || '').localeCompare(String(b.file_path || ''));
      });
    }

    function ensure3DSphereGradients() {
      const defs = document.querySelector('#kg-svg defs');
      if (!defs || document.getElementById('grad3d-default')) return;
      let gradHtml = '';
      const allCols = Object.assign({ default: '#38bdf8' }, TYPE_COLORS);
      Object.keys(allCols).forEach(k => {

        gradHtml += `
