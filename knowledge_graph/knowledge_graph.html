<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💡 Codebase Graphical Knowledge Graph</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-alt: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --on-bg: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      --on-border: #38bdf8;
      --off-bg: #0f172a;
      --off-border: #334155;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Control Deck: Row 1 (Search + Top-10 Ranked Result ON/OFF Buttons) + Row 2 (Node Type ON/OFF Buttons) */
    .kg-control-deck {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
      z-index: 20;
    }

    /* Row 1: Search Box + Top-10 Ranked Results alongside the top line */
    .kg-top-line {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 38px;
    }
    .kg-search-wrap {
      position: relative;
      flex: 0 0 340px;
      display: flex;
      align-items: center;
    }
    .kg-search-icon {
      position: absolute;
      left: 11px;
      font-size: 0.88rem;
      color: var(--accent);
      pointer-events: none;
    }
    .kg-search-input {
      width: 100%;
      padding: 8px 30px 8px 34px;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #070b14;
      color: var(--text);
      font-size: 0.84rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kg-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .kg-search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 4px;
      display: none;
    }
    .kg-search-clear:hover { color: #fff; }

    /* Top-line Ranked Result ON/OFF Buttons strip */
    .kg-results-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }
    .kg-results-strip::-webkit-scrollbar { height: 4px; }
    .kg-results-strip::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* Copy Query 2 Button & Ask Input */
    .kg-ask-input {
      width: 210px;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #070b14;
      color: var(--text);
      font-size: 0.78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
      flex-shrink: 0;
    }
    .kg-ask-input:focus {
      border-color: #a855f7;
    }
    .kg-copy-q2-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 7px;
      border: 1px solid #a855f7;
      background: linear-gradient(135deg, #7c3aed 0%, #0284c7 100%);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.35);
      transition: all 0.15s ease;
    }
    .kg-copy-q2-btn:hover {
      filter: brightness(1.12);
      border-color: #38bdf8;
    }
    .kg-copy-q2-btn.copied {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #4ade80;
    }

    /* Row 2: query_kg.py CLI Flag Checkboxes Bar */
    .kg-flags-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 7px;
    }
    .flag-chk-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.74rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #cbd5e1;
      background: #0f172a;
      border: 1px solid #334155;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .flag-chk-label:hover {
      border-color: #64748b;
      color: #ffffff;
    }
    .flag-chk-label.checked {
      background: rgba(124, 58, 237, 0.2);
      border-color: #a855f7;
      color: #f3e8ff;
    }
    .flag-chk-label input[type="checkbox"] {
      accent-color: #a855f7;
      margin: 0;
      cursor: pointer;
    }
    .cmd-preview-pill {
      margin-left: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.73rem;
      color: #38bdf8;
      background: #070b14;
      border: 1px solid #1e293b;
      padding: 3px 9px;
      border-radius: 5px;
      white-space: nowrap;
      max-width: 440px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Copied Query 2 Prompt Preview Drawer */
    .kg-prompt-drawer {
      position: absolute;
      bottom: 54px;
      right: 14px;
      width: min(680px, calc(100vw - 28px));
      max-height: 320px;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid #a855f7;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      z-index: 30;
      overflow: hidden;
    }
    .kg-prompt-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1e1b4b;
      border-bottom: 1px solid #334155;
      font-size: 0.78rem;
      font-weight: 700;
      color: #e9d5ff;
    }
    .kg-prompt-drawer pre {
      margin: 0;
      padding: 10px 12px;
      font-size: 0.73rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e2e8f0;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Row 3: Node Options ON/OFF Toggle Buttons below the text box */
    .kg-node-options-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .kg-row-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-right: 4px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Shared ON/OFF Toggle Button Style */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: all 0.14s ease;
      border: 1px solid var(--off-border);
      background: var(--off-bg);
      color: var(--muted);
    }
    .toggle-btn:hover {
      border-color: #64748b;
      color: #e2e8f0;
    }
    .toggle-btn.is-on {
      background: rgba(14, 165, 233, 0.16);
      border-color: var(--on-border);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.22);
    }
    .toggle-btn.result-btn.is-on {
      background: var(--on-bg);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }
    .toggle-state-pill {
      font-size: 0.63rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      font-family: ui-monospace, monospace;
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }
    .toggle-btn.is-on .toggle-state-pill {
      background: rgba(34, 197, 94, 0.25);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }
    .type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .rank-badge {
      background: rgba(15, 23, 42, 0.65);
      color: #38bdf8;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 800;
    }
    .toggle-btn.result-btn.is-on .rank-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Main Graphical Knowledge Graph Viewport */
    .kg-graph-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.55) 0%, rgba(11, 17, 32, 0.98) 75%),
        linear-gradient(rgba(51, 65, 85, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(51, 65, 85, 0.12) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      cursor: grab;
    }
    .kg-graph-stage.dragging { cursor: grabbing; }
    #kg-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Overlay HUD inside Graph Canvas */
    .kg-hud-top-left {
      position: absolute;
      top: 12px;
      left: 14px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .kg-hud-top-right {
      position: absolute;
      top: 12px;
      right: 14px;
      display: flex;
      gap: 6px;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }
    .hud-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Bottom Node Inspector Bar */
    .kg-inspector-bar {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: #e2e8f0;
    }
    .inspector-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .inspector-meta code {
      color: #7dd3fc;
      background: rgba(2, 132, 199, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
    }
    .kg-node-group { cursor: pointer; }
    .kg-node-group:hover circle.node-core {
      filter: drop-shadow(0 0 10px #38bdf8);
      stroke-width: 3px;
    }
    .kg-node-group .node-label-auto {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    .kg-node-group:hover .node-label-auto,
    svg.kg-zoomed-in .kg-node-group .node-label-auto {
      opacity: 1;
    }
  </style>
</head>

    <!-- Row 1: Search Text Box + Copy Query 2 (--#<N>) Button + All Results & Top 10 Ranked Result (#1..#10) ON/OFF Toggle Buttons -->
    <div class="kg-top-line">
      <div class="kg-search-wrap">
        <span class="kg-search-icon">🔍</span>
        <input type="text" id="kg-search-input" class="kg-search-input"
               placeholder='Search text (same as query_kg.py "search text" /S)...'
               oninput="onSearchInput()">
        <button type="button" id="kg-search-clear" class="kg-search-clear" onclick="clearSearch()" title="Clear search">✕</button>
      </div>
      <input type="text" id="kg-ask-input" class="kg-ask-input"
             placeholder="Optional LLM ask (--ask)..."
             oninput="updateCliCommandPreview()">
      <button type="button" id="kg-copy-q2-btn" class="kg-copy-q2-btn" onclick="copyQuery2ToClipboard()"
              title='Execute Query 2 (query_kg.py "searchtext" --#<N> [checked flags]) and copy LLM prompt to clipboard'>
        <span id="kg-copy-q2-label">📋 Copy --#1 /I</span>
      </button>
      <div class="kg-results-strip" id="kg-results-strip"></div>
    </div>

    <!-- Row 2: All Available query_kg.py Flag Options as Checkboxes -->
    <div class="kg-flags-line" id="kg-flags-line"></div>

    <!-- Row 3: Node Option Selectors (ON/OFF Toggle Buttons) below the text box -->
    <div class="kg-node-options-line" id="kg-node-options-line"></div>
  </div>

  <!-- Single Graphical Knowledge Graph Canvas for the Full Codebase -->
  <div class="kg-graph-stage" id="kg-graph-stage">
    <svg id="kg-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" opacity="0.85"/>
        </marker>
        <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" opacity="0.85"/>
        </marker>
        <marker id="arrow-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" opacity="0.7"/>
        </marker>
      </defs>
      <g id="kg-viewport"></g>
    </svg>

    <div class="kg-hud-top-left" id="kg-hud-status">
      <span>💡 <strong id="hud-mode-title">Full Codebase Knowledge Graph</strong></span>
      <span>•</span>
      <span>Total Matches: <strong id="hud-match-count" style="color:#c084fc;">0</strong></span>
      <span>•</span>
      <span>Graph Nodes: <strong id="hud-node-count" style="color:#38bdf8;">0</strong></span>
      <span>•</span>
      <span>Synapses/Edges: <strong id="hud-edge-count" style="color:#4ade80;">0</strong></span>
    </div>

    <div class="kg-hud-top-right">
      <button type="button" id="hud-3d-spin-btn" class="hud-btn" onclick="toggle3DAutoSpin()" title="Toggle 3D Spatial Auto-Rotation (Drag to 3D Orbit, Shift+Drag to Pan)" style="border-color:#475569;color:#94a3b8;font-weight:700;">🌐 3D Spin: OFF</button>
      <button type="button" class="hud-btn" onclick="clearAndCompactGraphMemory()" title="Clear cached graph DOM/memory and reset to clean 3D view" style="border-color:#10b981;color:#34d399;font-weight:700;">🧹 Clear Memory</button>
      <button type="button" class="hud-btn" onclick="zoomBy(1.22)" title="Zoom In (3D Perspective)">＋ Zoom In</button>
      <button type="button" class="hud-btn" onclick="zoomBy(0.82)" title="Zoom Out (3D Perspective)">－ Zoom Out</button>
      <button type="button" class="hud-btn" onclick="resetTransform()" title="Reset 3D Orbit, Pan & Zoom">🧭 Reset 3D Orbit</button>
    </div>

    <div class="kg-prompt-drawer" id="kg-prompt-drawer">
      <div class="kg-prompt-drawer-header">
        <span id="kg-prompt-drawer-title">✅ Copied Query 2 Prompt to Clipboard</span>
        <button type="button" class="hud-btn" style="padding:2px 8px;" onclick="document.getElementById('kg-prompt-drawer').style.display='none'">✕ Close</button>
      </div>
      <pre id="kg-prompt-drawer-body"></pre>
    </div>

    <div class="kg-inspector-bar" id="kg-inspector-bar">
      <div class="inspector-meta" id="inspector-content">
        <span>Enter search text above or click any <strong>#1–#10</strong> result button on the top line to focus the Knowledge Graph on that result node.</span>
      </div>
      <div id="inspector-actions" style="flex-shrink:0;"></div>
    </div>
  </div>

at_Sheet.txt [Section 1]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 1 of ASQ_CSSBB_Cheat_Sheet.txt: ================================================================================ ASQ CSSBB EXAM CHEAT SHEET (2022 BoK) - EASY SKIM EDITION ================================================================================ ", "metadata": {"section_index": 1, "section_type": "section", "text_excerpt": "================================================================================\nASQ CSSBB EXAM CHEAT SHEET (2022 BoK) - EASY SKIM EDITION\n================================================================================\n\n--------------------------------------------------------------------------------\n1. ALL-IN-ONE HYPOTHESIS TEST PACKAGE (VI.B.3 & VI.B.4)\n--------------------------------------------------------------------------------\nA. COMPARING MEANS (Continuous + NORMAL Data - Parametric)\n- 1 Mean vs. Target (pop. sigma KNOWN)   : 1-Sample Z-test\n- 1 Mean vs. Target (pop. sigma UNKNOWN) : 1-Sample t-test\n- 2 Independent Means (Group A vs. B)    : 2-Sample t-test (Pooled = equal var; Welch = unequal var)\n- 2 Paired Means (SAME items Before/After): Paired t-test\n- 3+ Independent Means (4", "char_count": 1200}}, {"id": "topic:means", "type": "topic_entity", "name": "means", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'means' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "means"}}, {"id": "topic:sample", "type": "topic_entity", "name": "sample", "file_path": "chats/transcript_b6556366.jsonl", "description": "Shared domain topic 'sample' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "sample"}}, {"id": "topic:anova", "type": "topic_entity", "name": "anova", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'anova' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "anova"}}, {"id": "topic:independent", "type": "topic_entity", "name": "independent", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'independent' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "independent"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:2", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 2]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 2 of ASQ_CSSBB_Cheat_Sheet.txt: y U test (Non-normal twin of 2-Sample t) - 2 Paired Medians (SAME items, skewed) : Paired Wilcoxon Signed-Rank (Non-normal twin of Paired t) - 3+ Independent Medians (3+ skewed) : Kruskal-Wallis test (Non-normal twin of ", "metadata": {"section_index": 2, "section_type": "section", "text_excerpt": "y U test  (Non-normal twin of 2-Sample t)\n- 2 Paired Medians (SAME items, skewed)  : Paired Wilcoxon Signed-Rank (Non-normal twin of Paired t)\n- 3+ Independent Medians (3+ skewed)     : Kruskal-Wallis test  (Non-normal twin of One-Way ANOVA; or Mood's Median for wild outliers)\n- 3+ Blocked / Related Medians (skewed)  : Friedman test        (Non-normal twin of Block ANOVA)\n\nC. COMPARING VARIANCES / SPREAD (Consistency)\n- 1 Variance vs. Target (Normal)         : 1-Variance Chi-Square test\n- 2 Variances (Normal)                   : F-test\n- 3+ Variances (Normal ONLY)             : Bartlett's test (very sensitive if non-normal!)\n- 2 or 3+ Variances (Skewed / Non-Normal): Levene's test\n\nD. COMPARING PROPORTIONS (% Pass/Fail, % Defective)\n- 1 Proportion vs. Target %              : 1-Proportion Z", "char_count": 1200}}, {"id": "topic:non-normal", "type": "topic_entity", "name": "non-normal", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'non-normal' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "non-normal"}}, {"id": "topic:chi-square", "type": "topic_entity", "name": "chi-square", "file_path": "chats/transcript_b6556366.jsonl", "description": "Shared domain topic 'chi-square' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "chi-square"}}, {"id": "topic:skewed", "type": "topic_entity", "name": "skewed", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'skewed' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "skewed"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:3", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 3]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 3 of ASQ_CSSBB_Cheat_Sheet.txt: CHECKING RANDOMNESS OVER TIME - 1 Time-Ordered Sequence : Runs test (checks clustering, trends, oscillation) -------------------------------------------------------------------------------- 2. MEASUREMENT SYSTEMS ANALYSI", "metadata": {"section_index": 3, "section_type": "section", "text_excerpt": "CHECKING RANDOMNESS OVER TIME\n- 1 Time-Ordered Sequence                : Runs test (checks clustering, trends, oscillation)\n\n\n--------------------------------------------------------------------------------\n2. MEASUREMENT SYSTEMS ANALYSIS - MSA (V.C.2)\n--------------------------------------------------------------------------------\n[ACCURACY = Average vs. True NIST Standard]\n- Bias       : Average off at 1 single point (Fix: re-zero / calibrate)\n- Linearity  : Bias changes across low, medium, high range (Fix: multi-point cal)\n- Stability  : Accuracy drifts over TIME, e.g. Mon -> Wed -> Fri (Fix: X-bar/R chart)\n\n[PRECISION = Spread / Scatter]\n- Repeatability (EV)   : SAME operator, SAME part, SAME gage\n- Reproducibility (AV) : DIFFERENT operators, SAME part, SAME gage\n\n[ATTRIBUTE MSA & RESO", "char_count": 1199}}, {"id": "topic:same", "type": "topic_entity", "name": "same", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'same' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "same"}}, {"id": "topic:gage", "type": "topic_entity", "name": "gage", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'gage' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "gage"}}, {"id": "topic:average", "type": "topic_entity", "name": "average", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'average' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "average"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:4", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 4]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 4 of ASQ_CSSBB_Cheat_Sheet.txt: ------------------------------------------------------------- - N = Nominal : Names/Labels only, no order (Shift A/B/C, Defect Type) - O = Ordinal : Ordered ranks, unequal gaps (1-to-5 Survey, 1st/2nd/3rd place) - I = In", "metadata": {"section_index": 4, "section_type": "section", "text_excerpt": "-------------------------------------------------------------\n- N = Nominal  : Names/Labels only, no order (Shift A/B/C, Defect Type)\n- O = Ordinal  : Ordered ranks, unequal gaps (1-to-5 Survey, 1st/2nd/3rd place)\n- I = Interval : Equal gaps, NO true zero (Celsius, Fahrenheit, Calendar Year)\n- R = Ratio    : Equal gaps WITH true zero (Time, Weight, Cost, Length, Kelvin)\n\n\n--------------------------------------------------------------------------------\n4. PROBABILITY RULES & DISTRIBUTIONS (V.E)\n--------------------------------------------------------------------------------\n- Complement (NOT A)     : P(not A) = 1 - P(A)\n- Addition (A OR B)      : P(A or B) = P(A) + P(B) - P(A and B)\n- Multiplication (A & B) : Independent: P(A)*P(B) | Dependent: P(A)*P(B|A)\n- Permutations vs Combos : Order M", "char_count": 1200}}, {"id": "topic:order", "type": "topic_entity", "name": "order", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'order' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "order"}}, {"id": "topic:equal", "type": "topic_entity", "name": "equal", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'equal' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "equal"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:5", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 5]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 5 of ASQ_CSSBB_Cheat_Sheet.txt: in HALF -> 4x n! -------------------------------------------------------------------------------- 5. QUICK FORMULAS (V.A & V.F) -------------------------------------------------------------------------------- - Little's ", "metadata": {"section_index": 5, "section_type": "section", "text_excerpt": "in HALF -> 4x n!\n\n\n--------------------------------------------------------------------------------\n5. QUICK FORMULAS (V.A & V.F)\n--------------------------------------------------------------------------------\n- Little's Law : WIP = Throughput Rate * Lead Time  |  Lead Time = WIP / Rate\n- Takt Time    : Available Production Time / Customer Demand\n- RTY          : Step1 Yield * Step2 Yield * Step3 Yield ...\n- Cp           : (USL - LSL) / (6 * short-term sigma)   [Potential, ignores center]\n- Cpk          : Lower of (USL - Mean)/(3*s) or (Mean - LSL)/(3*s) [Actual]\n- DPMO         : (Defects / (Units * Opportunities per unit)) * 1,000,000\n\n\n--------------------------------------------------------------------------------\n6. CONTROL CHARTS - DEFECTIVES vs. DEFECTS vs. VARIABLES (VIII.A)\n------", "char_count": 1198}}, {"id": "topic:count", "type": "topic_entity", "name": "count", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'count' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "count"}}, {"id": "topic:defectives", "type": "topic_entity", "name": "defectives", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'defectives' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "defectives"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:6", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 6]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 6 of ASQ_CSSBB_Cheat_Sheet.txt: Defects (Inspection area/unit size MUST be CONSTANT) - u-chart : DEFECTS PER UNIT (rate) (Inspection area/unit size VARIES or Constant) C. CONTINUOUS / VARIABLES (Weight, Length, Time, Temperature) - I-MR chart : Subgrou", "metadata": {"section_index": 6, "section_type": "section", "text_excerpt": "Defects          (Inspection area/unit size MUST be CONSTANT)\n- u-chart  : DEFECTS PER UNIT (rate)   (Inspection area/unit size VARIES or Constant)\n\nC. CONTINUOUS / VARIABLES (Weight, Length, Time, Temperature)\n- I-MR chart     : Subgroup size = 1 (individual readings)\n- X-bar & R chart: Subgroup size = 2 to 9\n- X-bar & s chart: Subgroup size = 10 or more\n\nD. CONTROL CHART SIGNALS\n- Common-Cause (In Control / Stable): Random bounce inside control limits\n- Special-Cause (Out of Control)    : 1 point outside limits, OR 8-9 points on one side of centerline, OR 6+ points trending steadily up/down\n\n\n--------------------------------------------------------------------------------\n7. CORRELATION & LINEAR REGRESSION (VI.A.1 & VI.A.2)\n----------------------------------------------------------------", "char_count": 1200}}, {"id": "topic:size", "type": "topic_entity", "name": "size", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'size' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "size"}}, {"id": "topic:chart", "type": "topic_entity", "name": "chart", "file_path": "chats/transcript_b6556366.jsonl", "description": "Shared domain topic 'chart' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "chart"}}, {"id": "topic:correlation", "type": "topic_entity", "name": "correlation", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'correlation' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "correlation"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:7", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 7]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 7 of ASQ_CSSBB_Cheat_Sheet.txt: sion : Predicted Y = b0 + (b1 * X) - b1 (Slope) : Change in Y when X goes up by 1 unit [b1 = r * (sy / sx)] - b0 (Intercept) : Predicted Y when X = 0 [b0 = Y_bar - b1 * X_bar] - Extrapolation : NEVER predict outside the ", "metadata": {"section_index": 7, "section_type": "section", "text_excerpt": "sion  : Predicted Y = b0 + (b1 * X)\n  - b1 (Slope)       : Change in Y when X goes up by 1 unit [b1 = r * (sy / sx)]\n  - b0 (Intercept)   : Predicted Y when X = 0 [b0 = Y_bar - b1 * X_bar]\n  - Extrapolation    : NEVER predict outside the tested X data range.\n- Multiple Regression:\n  - Adjusted R-sq    : Use instead of R-sq when adding X's (penalizes useless X's).\n  - VIF              : Checks Multicollinearity (duplicate X's). VIF = 1 ideal; VIF > 5 or > 10 = bad.\n- 4 Residual Checks  : 1) Normal, 2) Constant Variance (no funnel/cone), 3) Independent over time (Durbin-Watson ~ 2.0), 4) No high-leverage outliers.\n- CI vs. PI          : Confidence Interval (narrower) = average Y; Prediction Interval (wider) = 1 single future Y.\n- Logistic Regression: Use when Y is Binary (Pass/Fail, Yes/No, ", "char_count": 1200}}, {"id": "topic:alpha", "type": "topic_entity", "name": "alpha", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Shared domain topic 'alpha' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "alpha"}}, {"id": "topic:beta", "type": "topic_entity", "name": "beta", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Shared domain topic 'beta' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "beta"}}, {"id": "topic:checks", "type": "topic_entity", "name": "checks", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'checks' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "checks"}}, {"id": "topic:error", "type": "topic_entity", "name": "error", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'error' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "error"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:8", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 8]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 8 of ASQ_CSSBB_Cheat_Sheet.txt: s (Mean, SD, and Range get pulled by outliers!). - VOC vs. CTQ : VOC = raw customer words/feedback; CTQ = measurable requirement translated from VOC. - c-chart vs. np-chart : c-chart = count of DEFECTS (flaws, constant a", "metadata": {"section_index": 8, "section_type": "section", "text_excerpt": "s (Mean, SD, and Range get pulled by outliers!).\n- VOC vs. CTQ              : VOC = raw customer words/feedback; CTQ = measurable requirement translated from VOC.\n- c-chart vs. np-chart     : c-chart = count of DEFECTS (flaws, constant area); np-chart = count of DEFECTIVES (bad units, constant n).\n- X-bar vs. R chart        : X-bar chart catches MEAN shifts; R chart catches SPREAD / VARIABILITY shifts.\n- Control vs. Spec Limits  : Control Limits (UCL/LCL) = Voice of PROCESS (VOP); Spec Limits (USL/LSL) = Voice of CUSTOMER (VOC).\n- Cp vs. Cpk               : Cp = spread only (ignores centering); Cpk = spread AND centering (\"k\" = centering).\n- H0 vs. Ha                : Null (H0) = NO difference / status quo (\"0\" = zero effect); Alternative (Ha) = desired improvement / difference.\n- Simple R", "char_count": 1199}}, {"id": "topic:centering", "type": "topic_entity", "name": "centering", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'centering' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "centering"}}, {"id": "topic:chance", "type": "topic_entity", "name": "chance", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Shared domain topic 'chance' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "chance"}}, {"id": "topic:limits", "type": "topic_entity", "name": "limits", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'limits' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "limits"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:9", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 9]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 9 of ASQ_CSSBB_Cheat_Sheet.txt: r on Curves : Pearson r ONLY sees STRAIGHT lines -> on an inverted-U curve, r can look near 0 and MISS a strong nonlinear link. - Process Owner vs Sponsor : Sponsor funds & removes barriers DURING project; PROCESS OWNER ", "metadata": {"section_index": 9, "section_type": "section", "text_excerpt": "r on Curves      : Pearson r ONLY sees STRAIGHT lines -> on an inverted-U curve, r can look near 0 and MISS a strong nonlinear link.\n- Process Owner vs Sponsor : Sponsor funds & removes barriers DURING project; PROCESS OWNER runs & sustains gains AFTER closure.\n- Rational Subgrouping     : Take consecutive parts from 1 short window (e.g., 5 consecutive parts/hr) so shifts show up BETWEEN subgroups.\n- Gage Bias vs Instability : Same wrong reading every time = BIAS (shifted bathroom scale); readings drifting over days = INSTABILITY.\n- Central Limit Theorem    : Even from skewed data, the distribution of SAMPLE MEANS always approaches NORMAL (bell curve).\n\n\n--------------------------------------------------------------------------------\n9. UNIT 1 COMPLETE QUALITY, LEAN & CHANGE LEADERS MAP (I", "char_count": 1199}}, {"id": "topic:bias", "type": "topic_entity", "name": "bias", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet_Tables.docx", "description": "Shared domain topic 'bias' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "bias"}}, {"id": "topic:consecutive", "type": "topic_entity", "name": "consecutive", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'consecutive' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "consecutive"}}, {"id": "topic:curve", "type": "topic_entity", "name": "curve", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Shared domain topic 'curve' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "curve"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:10", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 10]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 10 of ASQ_CSSBB_Cheat_Sheet.txt: (Planning, Control, Improvement), \"Fitness for Use\", Pareto Vital Few vs. Trivial Many. - Philip Crosby : \"Quality is Free\", \"ZERO DEFECTS\" (do it right the first time), Conformance to Requirements. - Kaoru Ishikawa : In", "metadata": {"section_index": 10, "section_type": "section", "text_excerpt": "(Planning, Control, Improvement), \"Fitness for Use\", Pareto Vital Few vs. Trivial Many.\n- Philip Crosby     : \"Quality is Free\", \"ZERO DEFECTS\" (do it right the first time), Conformance to Requirements.\n- Kaoru Ishikawa    : Invented FISHBONE (Cause-and-Effect) diagram, 7 Basic Quality Tools, Quality Circles.\n- Armand Feigenbaum : TOTAL QUALITY CONTROL (TQC) -> quality is everyone's job across all departments (\"Hidden Plant\").\n- Genichi Taguchi   : ROBUST DESIGN (insensitive to noise) + QUALITY LOSS FUNCTION (any drift from exact target costs money).\n- Taiichi Ohno      : Father of TOYOTA PRODUCTION SYSTEM (TPS), Just-In-Time (JIT) pull, 7 Lean Wastes (Muda).\n- Shigeo Shingo     : Invented POKA-YOKE (mistake-proofing) and SMED (Single-Minute Exchange of Die / quick setups).\n- Bill Smith   ", "char_count": 1200}}, {"id": "topic:step", "type": "topic_entity", "name": "step", "file_path": "documents/Unit1_Quality_And_Change_Leaders_Table.docx", "description": "Shared domain topic 'step' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "step"}}, {"id": "topic:change", "type": "topic_entity", "name": "change", "file_path": "documents/Unit1_Quality_And_Change_Leaders_Table.docx", "description": "Shared domain topic 'change' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "change"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:11", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 11]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 11 of ASQ_CSSBB_Cheat_Sheet.txt: m Wins -> Step 8 = Anchor in Culture. - William Bridges (3 Phases): Psychological Transition -> 1) Ending/Letting Go -> 2) Neutral Zone (in-between confusion) -> 3) New Beginning. C. SHORT & SWEET 2-WORD MEMORY HOOKS (IN", "metadata": {"section_index": 11, "section_type": "section", "text_excerpt": "m Wins -> Step 8 = Anchor in Culture.\n- William Bridges (3 Phases): Psychological Transition -> 1) Ending/Letting Go -> 2) Neutral Zone (in-between confusion) -> 3) New Beginning.\n\nC. SHORT & SWEET 2-WORD MEMORY HOOKS (INSTANT EXAM RECALL)\n- Shewhart   = CONTROL CHARTS  (\"S-C\": Shewhart Charts + originated PDSA)\n- Deming     = SYSTEM / 14 PTS (\"D\": Deming blames management's system, popularized PDCA)\n- Juran      = TRILOGY + FIT   (\"J\": Juran = Fitness for Use + 3-part Trilogy + Pareto 80/20)\n- Crosby     = ZERO DEFECTS    (\"C\": Crosby = Conformance + Quality is Free + Zero Defects)\n- Ishikawa   = FISHBONE        (\"I-shikawa\" -> F-ishbone + 7 Basic Tools + Quality Circles)\n- Feigenbaum = HIDDEN PLANT    (\"F\": Feigenbaum = Total Quality Control across all depts)\n- Taguchi    = TARGET / NOIS", "char_count": 1199}}, {"id": "topic:system", "type": "topic_entity", "name": "system", "file_path": "documents/Unit1_Quality_And_Change_Leaders_Table.docx", "description": "Shared domain topic 'system' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "system"}}, {"id": "topic:charts", "type": "topic_entity", "name": "charts", "file_path": "chats/transcript_b6556366.jsonl", "description": "Shared domain topic 'charts' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "charts"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:12", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 12]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 12 of ASQ_CSSBB_Cheat_Sheet.txt: - Kotter = 8 STEPS (Step 1 Urgency -> Step 2 Coalition -> Step 6 Wins -> Step 8 Culture) - Bridges = NEUTRAL ZONE (Feelings bridge: Ending -> Neutral Zone -> New Beginning) -----------------------------------------------", "metadata": {"section_index": 12, "section_type": "section", "text_excerpt": "- Kotter     = 8 STEPS         (Step 1 Urgency -> Step 2 Coalition -> Step 6 Wins -> Step 8 Culture)\n- Bridges    = NEUTRAL ZONE    (Feelings bridge: Ending -> Neutral Zone -> New Beginning)\n\n\n--------------------------------------------------------------------------------\n10. UNIT 2 (DOMAIN II) \u2014 DPU / DPMO / FTY / RTY, COQ, FINANCIALS & BENCHMARKING\n--------------------------------------------------------------------------------\nA. DEFECT & YIELD METRICS (PLAIN ENGLISH + TINY EXAMPLES)\n- Defect vs. Defective : Defect = 1 flaw; Defective = 1 bad unit (1 invoice with 3 typos = 1 defective, 3 defects!).\n- DPU  (Defects/Unit)  : Total Defects / Total Units (15 typos / 10 invoices = 1.50 DPU).\n- DPO  (Defects/Opp.)  : Defects / (Units x Opportunities per unit) (15 / (10 x 5 fields) = 0.30 DPO", "char_count": 1200}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:13", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 13]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 13 of ASQ_CSSBB_Cheat_Sheet.txt: ning, preventive maintenance, Poka-yoke). - Appraisal : CHECK / TEST / INSPECT / CALIBRATE (incoming inspection, lab tests, GAGE CALIBRATION!). - Internal Failure : Caught & fixed BEFORE customer sees it (scrap, rework o", "metadata": {"section_index": 13, "section_type": "section", "text_excerpt": "ning, preventive maintenance, Poka-yoke).\n- Appraisal            : CHECK / TEST / INSPECT / CALIBRATE (incoming inspection, lab tests, GAGE CALIBRATION!).\n- Internal Failure     : Caught & fixed BEFORE customer sees it (scrap, rework on your own dock).\n- External Failure     : Customer finds it AFTER delivery \u2014 worst/costliest (returns, warranty, recalls).\n\nC. FINANCIAL & SCORECARD MEASURES\n- ROI                  : (Net Benefit - Cost) / Cost x 100%.\n- Payback Period       : Upfront Cost / Annual Cash Savings (shorter = better).\n- NPV                  : Today's value of future cash minus cost (NPV > 0 = Approve; NPV < 0 = Reject!).\n- IRR                  : Discount rate where NPV = 0 (Approve if IRR > company hurdle rate).\n- CBA / ROA            : CBA = Benefits / Costs (> 1.0 good); ROA =", "char_count": 1200}}, {"id": "topic:internal", "type": "topic_entity", "name": "internal", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'internal' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "internal"}}, {"id": "topic:approve", "type": "topic_entity", "name": "approve", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'approve' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "approve"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:14", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 14]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 14 of ASQ_CSSBB_Cheat_Sheet.txt: re teams/plants INSIDE your own company. - Competitive : Compare directly against rival companies in your same industry. - Functional / Process : Study a similar workflow in a DIFFERENT industry (hospital ER studying NAS", "metadata": {"section_index": 14, "section_type": "section", "text_excerpt": "re teams/plants INSIDE your own company.\n- Competitive          : Compare directly against rival companies in your same industry.\n- Functional / Process : Study a similar workflow in a DIFFERENT industry (hospital ER studying NASCAR pit crew).\n- Strategic/Breakthru  : Long-term business model leap studied from world-class leaders.\n\nE. COMPLETE UNIT 2 EXACT FORMULAS (ALL QUANTITATIVE METRICS)\n- DPU                  : Total Defects / Total Units\n- DPO                  : Total Defects / (Total Units x Opportunities per Unit)\n- DPMO                 : DPO x 1,000,000\n- Final Yield          : Good Units Shipped (incl. reworked) / Total Started\n- FTY (First Time Yld) : (Units Entered - Scrap - Rework) / Units Entered\n- RTY (Rolled Yield)   : FTY1 x FTY2 x ... x FTYk   (or Poisson shortcut: e^(-DP", "char_count": 1200}}, {"id": "topic:copq", "type": "topic_entity", "name": "copq", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'copq' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "copq"}}, {"id": "topic:failure", "type": "topic_entity", "name": "failure", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'failure' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "failure"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Cheat_Sheet.txt:15", "type": "document_section", "name": "ASQ_CSSBB_Cheat_Sheet.txt [Section 15]", "file_path": "documents/ASQ_CSSBB_Cheat_Sheet.txt", "description": "Section 15 of ASQ_CSSBB_Cheat_Sheet.txt: t Value (PV) : FV / (1 + r)^n - NPV : [CF1/(1+r)^1 + CF2/(1+r)^2 + ... + CFn/(1+r)^n] - Initial Investment (NPV > 0 = Approve) - IRR : Discount rate r where NPV = 0 (Approve if IRR > Hurdle Rate / MARR) - CBA / BCR : Tot", "metadata": {"section_index": 15, "section_type": "section", "text_excerpt": "t Value (PV)   : FV / (1 + r)^n\n- NPV                  : [CF1/(1+r)^1 + CF2/(1+r)^2 + ... + CFn/(1+r)^n] - Initial Investment (NPV > 0 = Approve)\n- IRR                  : Discount rate r where NPV = 0 (Approve if IRR > Hurdle Rate / MARR)\n- CBA / BCR            : Total Discounted Benefits / Total Discounted Costs (Approve if BCR > 1.0)\n- ROA (%)              : (Net Income / Total Assets) x 100%\n- Sigma <-> DPMO Key   : 2s = 308,538 | 3s = 66,807 | 4s = 6,210 | 5s = 233 | 6s = 3.4 DPMO (with 1.5s shift)\n================================================================================", "char_count": 588}}, {"id": "topic:discounted", "type": "topic_entity", "name": "discounted", "file_path": "documents/Unit2_Formulas_Master_Sheet.docx", "description": "Shared domain topic 'discounted' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "discounted"}}, {"id": "topic:dpmo", "type": "topic_entity", "name": "dpmo", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'dpmo' connecting multi-modal documents and workspace chats" e_2027.docx: Tab 9 Domain IX: Design for Six Sigma (DFSS) 6 Qs Entitlement Ceiling, Full DMADV Phase Table, Full DFX Selector (DFC/DFP/DFA/DFM/DFT/DFR), QFD, Full Taguchi Robust Design (System -> Parameter -> Tolerance), Quality Loss", "metadata": {"section_index": 7, "section_type": "section", "text_excerpt": "Tab 9\nDomain IX: Design for Six Sigma (DFSS)\n6 Qs\nEntitlement Ceiling, Full DMADV Phase Table, Full DFX Selector (DFC/DFP/DFA/DFM/DFT/DFR), QFD, Full Taguchi Robust Design (System -> Parameter -> Tolerance), Quality Loss Function, Statistical (RSS) vs. Worst-Case Tolerance\nDMAIC 5-Phase Full Keyword & Trigger Phrase Guide\nDEFINE \u2014 Keywords That Always Point Here\nDefine is about framing, alignment, and scope. Look for words about the problem itself, not the data. Trigger phrase: 'We need clarity before measuring.'\n\u2022 Problem statement unclear / too broad / includes root cause", "char_count": 580}}, {"id": "topic:design", "type": "topic_entity", "name": "design", "file_path": "documents/ASQ_CSSBB_Verbatim_DMAIC_Bible_2027.docx", "description": "Shared domain topic 'design' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "design"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Master_Word_Bible_2027.docx:8", "type": "document_section", "name": "ASQ_CSSBB_Master_Word_Bible_2027.docx [Section 8]", "file_path": "documents/ASQ_CSSBB_Master_Word_Bible_2027.docx", "description": "Section 8 of ASQ_CSSBB_Master_Word_Bible_2027.docx: \u2022 Voice of Customer (VOC), CTQs / customer requirements / customer needs \u2022 SIPOC creation, high-level process map, project scope / boundaries / charter \u2022 Stakeholder alignment / buy-in, business case / impact statement, ", "metadata": {"section_index": 8, "section_type": "section", "text_excerpt": "\u2022 Voice of Customer (VOC), CTQs / customer requirements / customer needs\n\u2022 SIPOC creation, high-level process map, project scope / boundaries / charter\n\u2022 Stakeholder alignment / buy-in, business case / impact statement, pain points identified but not yet measured\nMEASURE \u2014 Keywords That Always Point Here\nMeasure is about quantifying variation, validating data, and establishing the baseline. Trigger phrase: 'We need real data to understand the variation.'\n\u2022 MSA / GRR / bias / linearity / stability; data collection plan; operational definitions\n\u2022 Baseline performance, current sigma level / DPMO, capability (Cp/Cpk) for normal data\n\u2022 Supplier variation, input variation (Xs), validating SIPOC assumptions, 'We need to quantify...'", "char_count": 735}}, {"id": "topic:variation", "type": "topic_entity", "name": "variation", "file_path": "chats/transcript_b6556366.jsonl", "description": "Shared domain topic 'variation' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "variation"}}, {"id": "topic:baseline", "type": "topic_entity", "name": "baseline", "file_path": "documents/ASQ_CSSBB_Master_Word_Bible_2027.docx", "description": "Shared domain topic 'baseline' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "baseline"}}, {"id": "topic:measure", "type": "topic_entity", "name": "measure", "file_path": "documents/ASQ_CSSBB_Master_Word_Bible_2027.docx", "description": "Shared domain topic 'measure' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "measure"}}, {"id": "doc_sec:documents/ASQ_CSSBB_Master_Word_Bible_2027.docx:9", "type": "document_section", "name": "ASQ_CSSBB_Master_Word_Bible_2027.docx [Section 9]", "file_path": "documents/ASQ_CSSBB_Master_Word_Bible_2027.docx", "description": "Section 9 of ASQ_CSSBB_Master_Word_Bible_2027.docx: ANALYZE \u2014 Keywords That Always Point Here Analyze is about finding and proving the root cause using statistical evidence. Trigger phrase: 'We need to prove the cause.' \u2022 Hypothesis tests (t, Z, Chi-Square, ANOVA), regres", "metadata": {"section_index": 9, "section_type": "section", "text_ex raw' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "draw"}}, {"id": "topic:magic", "type": "topic_entity", "name": "magic", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'magic' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "magic"}}, {"id": "doc_sec:documents/ASQ_Sampling_Methods_Quick_Table.docx:2", "type": "document_section", "name": "ASQ_Sampling_Methods_Quick_Table.docx [Section 2]", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Section 2 of ASQ_Sampling_Methods_Quick_Table.docx: Unbiased; needs full list of items. Stratified \"from EACH shift / plant / group\" | \"divide into strata first\" Split into buckets FIRST (Shift 1, 2, 3), then sample a FEW from EVERY bucket. Always samples ALL groups (neve", "metadata": {"section_index": 2, "section_type": "section", "text_excerpt": "Unbiased; needs full list of items.\nStratified\n\"from EACH shift / plant / group\" | \"divide into strata first\"\nSplit into buckets FIRST (Shift 1, 2, 3), then sample a FEW from EVERY bucket.\nAlways samples ALL groups (never skips a group).\nSystematic\n\"every k-th item\" | \"every 10th box\" | \"fixed interval\"\nPick a random start, then grab every 10th box off the belt.", "char_count": 364}}, {"id": "topic:first", "type": "topic_entity", "name": "first", "file_path": "documents/Unit2_Process_Mgmt_And_Measures_Table.docx", "description": "Shared domain topic 'first' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "first"}}, {"id": "topic:group", "type": "topic_entity", "name": "group", "file_path": "documents/Unit3_Team_Management_Bible_Table.docx", "description": "Shared domain topic 'group' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "group"}}, {"id": "topic:shift", "type": "topic_entity", "name": "shift", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'shift' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "shift"}}, {"id": "doc_sec:documents/ASQ_Sampling_Methods_Quick_Table.docx:3", "type": "document_section", "name": "ASQ_Sampling_Methods_Quick_Table.docx [Section 3]", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Section 3 of ASQ_Sampling_Methods_Quick_Table.docx: TRAP: fails if machine has a repeating cycle matching k! Cluster \"pick a few WHOLE groups\" | \"geographic / warehouses\" | \"inspect ALL inside\" Pick 3 whole warehouses out of 40 and inspect EVERY box inside those 3. Unlike", "metadata": {"section_index": 3, "section_type": "section", "text_excerpt": "TRAP: fails if machine has a repeating cycle matching k!\nCluster\n\"pick a few WHOLE groups\" | \"geographic / warehouses\" | \"inspect ALL inside\"\nPick 3 whole warehouses out of 40 and inspect EVERY box inside those 3.\nUnlike Stratified, you skip most groups to save travel cost!\nRational Subgrouping\n\"consecutive parts\" | \"back-to-back\" | \"control chart subgroup\" | \"within vs between\"\nPull 4 or 5 BACK-TO-BACK bags every hour for an SPC control chart.", "char_count": 448}}, {"id": "doc_sec:documents/ASQ_Sampling_Methods_Quick_Table.docx:4", "type": "document_section", "name": "ASQ_Sampling_Methods_Quick_Table.docx [Section 4]", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Section 4 of ASQ_Sampling_Methods_Quick_Table.docx: NEVER pick Stratified when you see \"consecutive\" + \"control chart\"! Convenience \"easiest to reach\" | \"closest boxes\" | \"top of pallet\" | \"handy\" Lazily grab the top 5 boxes sitting right by the dock door. Biased \u2014 never ", "metadata": {"section_index": 4, "section_type": "section", "text_excerpt": "NEVER pick Stratified when you see \"consecutive\" + \"control chart\"!\nConvenience\n\"easiest to reach\" | \"closest boxes\" | \"top of pallet\" | \"handy\"\nLazily grab the top 5 boxes sitting right by the dock door.\nBiased \u2014 never use for formal statistical proof.\nJudgment (Purposive)\n\"expert hand-picks\" | \"supervisor chooses\" | \"based on experience\"\nA veteran supervisor hand-picks 5 known tricky orders to inspect.", "char_count": 407}}, {"id": "topic:boxes", "type": "topic_entity", "name": "boxes", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'boxes' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "boxes"}}, {"id": "topic:hand-picks", "type": "topic_entity", "name": "hand-picks", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'hand-picks' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "hand-picks"}}, {"id": "topic:never", "type": "topic_entity", "name": "never", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'never' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "never"}}, {"id": "topic:supervisor", "type": "topic_entity", "name": "supervisor", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Shared domain topic 'supervisor' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "supervisor"}}, {"id": "doc_sec:documents/ASQ_Sampling_Methods_Quick_Table.docx:5", "type": "document_section", "name": "ASQ_Sampling_Methods_Quick_Table.docx [Section 5]", "file_path": "documents/ASQ_Sampling_Methods_Quick_Table.docx", "description": "Section 5 of ASQ_Sampling_Methods_Quick_Table.docx: Biased \u2014 relies on human opinion, not probability. Golden Rule 1: See \"CONSECUTIVE\" or \"BACK-TO-BACK\" + \"CONTROL CHART\"? -> Instantly click RATIONAL SUBGROUPING! Golden Rule 2: See \"FROM EACH SHIFT / MACHINE / GROUP\"? ->", "metadata": {"section_index": 5, "section_type": "section", "text_excerpt": "Biased \u2014 rel : "Document PValue_And_Cp_Cpk_Quick_Tables.docx (7 section(s)): ASQ CSSBB Quick-Reference Tables: p-value (H0) & Cp / Cpk / Pp / Ppk Table 1: p-value & Hypothesis Testing (The Courtroom Rule) Picture a Courtroom: H0 = \"Innocent / Nothing Change", "metadata": {"format": "docx", "section_count": 7, "size_bytes": 2673, "topics": ["alpha", "garage", "long-term", "spread", "beta", "centered", "chance", "high"]}}, {"id": "doc_sec:documents/PValue_And_Cp_Cpk_Quick_Tables.docx:1", "type": "document_section", "name": "PValue_And_Cp_Cpk_Quick_Tables.docx [Section 1]", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Section 1 of PValue_And_Cp_Cpk_Quick_Tables.docx: ASQ CSSBB Quick-Reference Tables: p-value (H0) & Cp / Cpk / Pp / Ppk Table 1: p-value & Hypothesis Testing (The Courtroom Rule) Picture a Courtroom: H0 = \"Innocent / Nothing Changed\" | p-value = \"Chance the result was ju", "metadata": {"section_index": 1, "section_type": "section", "text_excerpt": "ASQ CSSBB Quick-Reference Tables: p-value (H0) & Cp / Cpk / Pp / Ppk\nTable 1: p-value & Hypothesis Testing (The Courtroom Rule)\nPicture a Courtroom: H0 = \"Innocent / Nothing Changed\"  |  p-value = \"Chance the result was just luck\"  |  alpha = \"Strictness bar (usually 0.05)\"\nWhat You See\nPlain-English Meaning\nOfficial ASQ Answer\nInstant Rhyme / Hook\np <= alpha (e.g. 0.03 <= 0.05)", "char_count": 381}}, {"id": "topic:p-value", "type": "topic_entity", "name": "p-value", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Shared domain topic 'p-value' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "p-value"}}, {"id": "topic:courtroom", "type": "topic_entity", "name": "courtroom", "file_path": "documents/PValue_And_Cp_Cpk_Quick_Tables.docx", "description": "Shared domain topic 'courtroom' connecting multi-modal documents and workspace chats", "metadata": {"keyword": "courtroom"}}, {"id": "topic:answer", "type": "topic_entit
